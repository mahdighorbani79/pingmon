name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Show project tree
        run: find android -type f | head -50

      - name: Decode keystore
        if: secrets.KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/pingmon.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build signed APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
        env:
          KEYSTORE_FILE: pingmon.keystore
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}

      - name: Build debug APK (fallback if no keystore)
        if: failure()
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          APK=$(find android -name "*.apk" | head -1)
          cp "$APK" pingmon-b${{ github.run_number }}.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "b${{ github.run_number }}" pingmon-b${{ github.run_number }}.apk --title "Build ${{ github.run_number }}" --notes "Automated build"
